<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="projectstyle.css" />
  </head>
  <body>
    <div class="page">
      <div class="logo-container">
        <div class="bg-trans">
          <h1>Odin</h1>
        </div>
      </div>

      <div class="form-section">
        <div class="heading-section">
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up
          <em>now</em> to get started. <br />
          <br />You know you want to.
        </div>

        
        <form action="#" method="get">
          <div class="form-box">
            <div class="form-item">
              <label for="fname">First Name</label>
              <input type="text" name="user-name" id="fname" />
            </div>
            <div class="form-item">
              <label for="lname">Last Name</label>
              <input type="text" name="user-name" id="lname" />
            </div>
            <div class="form-item">
              <label for="email">Email</label>
              <input type="email" name="user-mail" id="email" />
            </div>
            <div class="form-item">
              <label for="number">Phone Number</label>
              <input type="tel" name="user-num" id="number" />
            </div>
            <div class="form-item">
              <label for="pass">Password</label>
              <input type="password" name="user-pass" id="pass" pattern="^(?=.*[A-Z])[A-Za-z]{5,}$" />
            </div>
            <div class="form-item">
              <label for="conf-pass">Confirm Password</label>
              <input type="password" name="user-pass" id="conf-pass" pattern="^(?=.*[A-Z])[A-Za-z]{5,}$"/>
            </div>
          </div>
          <input type="submit" name="" id="" class="create" value="Create Account">
          <p>Already have an account? <a href="#">Log in</a></p>
        </form>

        <div>
          
          
        </div>
        </div>
        
      </div>
    </div>
  </body>
</html>
